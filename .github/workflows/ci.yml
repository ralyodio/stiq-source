name: CI

on:
  push:
  pull_request:

jobs:
  client:
    name: Client (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  # No-telemetry guard (PLAN.md §3.2): fail if a known analytics/crash SDK is added.
  issuer:
    name: Issuer mailbox (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issuer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            issuer/package-lock.json
            client/package-lock.json
      - run: npm ci
      # The issuer is not a self-contained package: issuer.js, organizer-server.mjs,
      # mailbox.mjs and organizer-nostr.mjs resolve @cloudflare/blindrsa-ts, nostr-tools and
      # ws out of ../client/node_modules at RUNTIME, and four of the chained tests do too.
      # That is deliberate -- issuer/deploy/client-deps.package.json installs them the same
      # way on a real box. Without this step the suite dies at draw_idempotency_test with
      # ERR_MODULE_NOT_FOUND, which is a CI-fidelity bug, not an issuer bug.
      - name: Install client deps (issuer imports them via ../client/node_modules)
        working-directory: client
        run: npm ci
      - run: npm test

  no-telemetry:
    name: No telemetry guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for banned analytics/telemetry packages
        run: |
          BANNED='sentry|firebase-analytics|@amplitude|segment|mixpanel|bugsnag|datadog|appcenter|google-analytics|posthog'
          if grep -REn "$BANNED" client/package.json 2>/dev/null; then
            echo "::error::Banned telemetry/analytics dependency detected (PLAN.md §3.2)"; exit 1
          fi
          echo "No banned telemetry packages found."

  relay:
    name: Relay (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: relay/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  # The native shells MUST be built by CI. The iOS scaffold drifted for months precisely because
  # nothing here ever ran `pod install` / `xcodebuild` (only ubuntu typecheck/test jobs existed), so
  # a green pipeline said nothing about whether the app links against Tor/OpenSSL or even compiles.
  # This job is that structural fix: a real device (arm64) build. `pod install` is not evidence —
  # xcodebuild is.
  ios-build:
    name: iOS (pod install + device build)
    # macos-15 is Xcode 16.4, whose newest SDK is iOS 18.5. react-native-camera-kit 18 reads
    # photoOutput.isDeferredStartSupported, which iOS 26 introduced: the pod guards the call with
    # `#available(iOS 26.0, *)`, but availability is a runtime question and the symbol still has to
    # exist to compile, so the build dies with "value of type 'AVCapturePhotoOutput' has no member".
    # The dependency wants the newer SDK; the runner is what has to move.
    runs-on: macos-26
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: pod install
        working-directory: client/ios
        run: pod install
      - name: xcodebuild (generic iOS device, arm64)
        working-directory: client/ios
        run: |
          set -o pipefail
          # -derivedDataPath is what puts the product under ./build, where the assertion below
          # goes looking for it. Without it xcodebuild writes to ~/Library/Developer/Xcode/
          # DerivedData, `find build` matches nothing, and the assertion inspects an empty path
          # and reports "tor not linked" — which reads like the drift it is meant to catch.
          xcodebuild \
            -workspace stiq.xcworkspace \
            -scheme stiq \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Assert Tor + single-OpenSSL link (the drift that hid for months)
        working-directory: client/ios
        run: |
          # Skip the dSYM. It contains a file of exactly the name being looked for, and finds it
          # first: build/.../stiq.app.dSYM/Contents/Resources/DWARF/stiq.debug.dylib. That is the
          # debug-symbol companion — DWARF, no __cstring — so `strings` finds no tor version in it
          # and the step reports the app is not linked against Tor while never having looked at
          # the app. The dylib inside the .app is the one carrying the code: with Xcode's debug
          # dylib, stiq.app/stiq is a launcher stub and stiq.app/stiq.debug.dylib is the binary,
          # which is why that name is preferred over the executable here.
          DYL="$(find build -path '*Debug-iphoneos*' -name 'stiq' -type f -not -path '*.dSYM/*' | head -1)"
          APP="$(find build -name 'stiq.debug.dylib' -not -path '*.dSYM/*' | head -1)"
          BIN="${APP:-$DYL}"
          echo "inspecting: $BIN"
          # Say which of the two it is. An empty BIN sends every check below into a file that is
          # not there, and `strings` on nothing reports "tor not linked" — the drift this step
          # exists to catch — when the truth is that it never found a binary to look at.
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "::error::no built binary under client/ios/build — the build moved, this step did not run its checks"
            find build -maxdepth 4 -name 'Debug-iphoneos' -o -maxdepth 4 -name '*.app' | head -20
            exit 1
          fi
          strings "$BIN" | grep -q "tor 0.4.9" || { echo "::error::tor 0.4.9.x not linked"; exit 1; }
          # Exactly one SSL_CTX_new symbol (tor's OpenSSL is static+hidden, op-sqlite's is a dynamic
          # import) — more than one means the two-static-OpenSSL collision reappeared.
          COUNT="$(nm "$BIN" | grep -c 'SSL_CTX_new' || true)"
          test "$COUNT" -le 1 || { echo "::error::multiple SSL_CTX_new symbols ($COUNT) — OpenSSL collision"; exit 1; }
          echo "OK: tor linked, SSL_CTX_new count=$COUNT"
